<!DOCTYPE html>
<html>
<head>
	<! This style sheet is taken from  https://www.w3schools.com/howto/howto_js_tabs.asp>
	<link href="styles.css" rel="stylesheet" type="text/css">
</head>

<body>

<div>
    <h1>FOOD MART</h1>
</div>

<!-- Tab links, each one with an onclick event associated with it -->
<div class="tab">
  <button class="tablinks" onclick="openInfo(event, 'Customer')">Customer</button>
  <button class="tablinks" onclick="openInfo(event, 'Products')">Products</button>
  <button class="tablinks" onclick="openInfo(event, 'Cart')">Cart</button>
</div>

<!-- Tab content -->
<div id="Customer" class="tabcontent">
  <h3>Customer Information</h3>
  <p>Tell us a bit about you.</p>
	Choose a Category:

    <form id="myForm">
        <label>Vegetarian</label>
        <input type="checkbox" id="veggieCheck"><br>

        <label>Gluten Free</label>
        <input type="checkbox" id="glutenCheck"><br>

        <label>Organic</label>
        <input type="checkbox" id="organicCheck"><br>

        <label>Larger Font Size</label>
        <input type="checkbox" id="fontCheck"><br>

        <label>Replace Text With Images</label>
        <input type="checkbox" id="imageCheck"><br>

        <button id="customerSubmit">Submit</button>
    </form>

</div>

<div id="Products" class="tabcontent">
  <h3>Your targeted products</h3>
  <p>We preselected products based on your restrictions.</p>
	 Choose items to buy:
	 <div id="displayProduct"></div>
	 <button id="addCart" type="button" class="block" onclick="selectedItems()">
		Add selected items to cart.
	</button>
</div>

<div id="Cart" class="tabcontent">
  <h3>Cart</h3>
  <p>Here is your cart.</p>
  <div id="displayCart"></div>
</div>

<script src="groceries.js"></script>
<script src="main.js"></script>

</body>
</html>
